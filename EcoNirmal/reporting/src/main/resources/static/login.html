<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoNirmal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            transition: transform 0.3s ease;
        }
        .login-card:hover {
            transform: translateY(-5px);
        }
        .btn-primary {
            background-color: #2e7d32;
            border: none;
            padding: 12px;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #1b5e20;
        }
        .form-control:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 0.2rem rgba(46,125,50,0.25);
        }
        .logo-icon {
            font-size: 3rem;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-tree-fill logo-icon"></i>
            <h2 class="mt-2">EcoNirmal</h2>
            <p class="text-muted">Login to your account</p>
        </div>
        <div id="errorMsg" class="alert alert-danger d-none"></div>
        <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" id="email" class="form-control" placeholder="Enter email" autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Password">
        </div>
        <div class="mb-3">
            <label class="form-label">Role</label>
            <select id="role" class="form-select">
                <option value="CITIZEN">Citizen</option>
                <option value="WORKER">Worker</option>
                <option value="ADMIN">Admin</option>
            </select>
        </div>
        <button onclick="login()" class="btn btn-primary w-100">Login</button>
        <p class="text-center mt-3">New user? <a href="register.html">Register here</a></p>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const selectedRole = document.getElementById('role').value;
            const errorDiv = document.getElementById('errorMsg');
            
            if (!email || !password) {
                errorDiv.innerText = 'Please fill all fields';
                errorDiv.classList.remove('d-none');
                return;
            }
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (data.message === "Login successful") {
                    if (data.role !== selectedRole) {
                        errorDiv.innerText = 'Role mismatch! You selected ' + selectedRole + ' but your account is ' + data.role;
                        errorDiv.classList.remove('d-none');
                        return;
                    }
                    // Store user info including email
                    data.email = email;
                    localStorage.setItem('user', JSON.stringify(data));
                    // Redirect based on role
                    if (data.role === 'CITIZEN') window.location.href = '/citizen/dashboard.html';
                    else if (data.role === 'WORKER') window.location.href = '/worker/dashboard.html';
                    else if (data.role === 'ADMIN') window.location.href = '/admin/dashboard.html';
                } else {
                    errorDiv.innerText = data.message;
                    errorDiv.classList.remove('d-none');
                }
            } catch (err) {
                errorDiv.innerText = 'Server error. Is backend running?';
                errorDiv.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
