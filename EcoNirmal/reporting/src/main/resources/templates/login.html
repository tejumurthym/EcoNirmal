!DOCTYPE html>
<html>
<head>
    <title>EcoNirmal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">EcoNirmal Login</div>
                <div class="card-body">
                    <div id="errorMsg" class="alert alert-danger d-none"></div>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" id="email" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Password</label>
                        <input type="password" id="password" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>Role</label>
                        <select id="role" class="form-control">
                            <option value="CITIZEN">Citizen</option>
                            <option value="WORKER">Worker</option>
                            <option value="ADMIN">Admin</option>
                        </select>
                    </div>
                    <button onclick="login()" class="btn btn-primary w-100">Login</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const role = document.getElementById('role').value;
        const errorDiv = document.getElementById('errorMsg');
        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await response.json();
        if (data.message === "Login successful") {
            if (data.role !== role) {
                errorDiv.innerText = 'Role mismatch!';
                errorDiv.classList.remove('d-none');
                return;
            }
            localStorage.setItem('user', JSON.stringify(data));
            if (data.role === 'CITIZEN') window.location.href = '/citizen/dashboard.html';
            else if (data.role === 'WORKER') window.location.href = '/worker/dashboard.html';
            else if (data.role === 'ADMIN') window.location.href = '/admin/dashboard.html';
        } else {
            errorDiv.innerText = data.message;
            errorDiv.classList.remove('d-none');
        }
    }
</script>
</body>
</html>
