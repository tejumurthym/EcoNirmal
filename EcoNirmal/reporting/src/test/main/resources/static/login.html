<!DOCTYPE html>
<html>
<head>
    <title>EcoNirmal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #e9f5e9; }
        .login-card { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #2e7d32; border: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 class="text-center mb-4">🌿 EcoNirmal Login</h2>
        <div id="errorMsg" class="alert alert-danger d-none"></div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" id="email" class="form-control" placeholder="Enter email">
        </div>
        <div class="mb-3">
            <label>Password</label>
            <input type="password" id="password" class="form-control" placeholder="Password">
        </div>
        <div class="mb-3">
            <label>Role</label>
            <select id="role" class="form-control">
                <option value="CITIZEN">Citizen</option>
                <option value="WORKER">Worker</option>
                <option value="ADMIN">Admin</option>
            </select>
        </div>
        <button onclick="login()" class="btn btn-primary w-100">Login</button>
        <p class="text-center mt-3">New user? <a href="register.html">Register</a></p>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const selectedRole = document.getElementById('role').value;
            const errorDiv = document.getElementById('errorMsg');
            if (!email || !password) {
                errorDiv.innerText = 'Please fill all fields';
                errorDiv.classList.remove('d-none');
                return;
            }
            try {
                const response = await fetch('http://localhost:8090/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (data.message === "Login successful") {
                    if (data.role !== selectedRole) {
                        errorDiv.innerText = 'Role mismatch! You selected ' + selectedRole + ' but your account is ' + data.role;
                        errorDiv.classList.remove('d-none');
                        return;
                    }
                    localStorage.setItem('user', JSON.stringify(data));
                    if (data.role === 'CITIZEN') window.location.href = '/citizen/dashboard.html';
                    else if (data.role === 'WORKER') window.location.href = '/worker/dashboard.html';
                    else if (data.role === 'ADMIN') window.location.href = '/admin/dashboard.html';
                } else {
                    errorDiv.innerText = data.message;
                    errorDiv.classList.remove('d-none');
                }
            } catch (err) {
                errorDiv.innerText = 'Server error. Is backend running?';
                errorDiv.classList.remove('d-none');
            }
        }
    </script>
</body>
</html>
