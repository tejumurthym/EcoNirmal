<!DOCTYPE html>
<html>
<head>
    <title>EcoNirmal - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #e9f5e9; }
        .register-card { max-width: 450px; margin: 80px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="register-card">
        <h2 class="text-center mb-4">🌿 EcoNirmal Register</h2>
        <div id="msg" class="alert d-none"></div>
        <div class="mb-3">
            <label>Full Name</label>
            <input type="text" id="name" class="form-control" placeholder="Enter name">
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" id="email" class="form-control" placeholder="Enter email">
        </div>
        <div class="mb-3">
            <label>Password</label>
            <input type="password" id="password" class="form-control" placeholder="Password">
        </div>
        <div class="mb-3">
            <label>Role</label>
            <select id="role" class="form-control">
                <option value="CITIZEN">Citizen</option>
                <option value="WORKER">Worker</option>
            </select>
            <small class="text-muted">Note: Workers need admin approval.</small>
        </div>
        <button onclick="register()" class="btn btn-primary w-100">Register</button>
        <p class="text-center mt-3">Already have an account? <a href="login.html">Login</a></p>
    </div>

    <script>
        async function register() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const msgDiv = document.getElementById('msg');
            
            if (!name || !email || !password) {
                msgDiv.innerText = 'All fields required';
                msgDiv.classList.remove('d-none');
                msgDiv.classList.add('alert-danger');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8090/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });
                const text = await response.text();
                if (response.ok && text === "User registered successfully!") {
                    msgDiv.innerText = 'Registration successful! Please login.';
                    msgDiv.classList.remove('alert-danger');
                    msgDiv.classList.add('alert-success');
                    msgDiv.classList.remove('d-none');
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else {
                    msgDiv.innerText = text;
                    msgDiv.classList.remove('d-none');
                    msgDiv.classList.add('alert-danger');
                }
            } catch (err) {
                msgDiv.innerText = 'Server error';
                msgDiv.classList.remove('d-none');
                msgDiv.classList.add('alert-danger');
            }
        }
    </script>
</body>
</html>
